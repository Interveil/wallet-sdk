name: wallet-sdk

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Login to crates.io
        run: cargo login ${{ secrets.CARGO_TOKEN }}

      # DAG: veil-storage → veil-eth/veil-sol/veil-pvx → veil-wallet-sdk → veil-cli
      # veil-eth/veil-sol/veil-pvx are independent — can run in parallel

      - name: Publish veil-storage
        run: cargo publish -p veil-storage

      - name: Publish veil-eth / veil-sol / veil-pvx
        run: |
          sleep 30
          cargo publish -p veil-eth
          sleep 15
          cargo publish -p veil-sol
          sleep 15
          cargo publish -p veil-pvx

      - name: Publish veil-wallet-sdk
        run: |
          sleep 30
          cargo publish -p veil-wallet-sdk

      - name: Publish veil-cli
        run: |
          sleep 30
          cargo publish -p veil-cli
