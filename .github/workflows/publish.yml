name: wallet-sdk

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Login to crates.io
        run: cargo login ${{ secrets.CARGO_TOKEN }}

      # DAG: storage → eth/sol/veil → sdk → wallet-cli
      # eth/sol/veil are independent — can run in parallel

      - name: Publish storage
        run: cargo publish -p storage

      - name: Publish eth / sol / veil
        run: |
          sleep 30
          cargo publish -p eth
          sleep 15
          cargo publish -p sol
          sleep 15
          cargo publish -p veil

      - name: Publish sdk
        run: |
          sleep 30
          cargo publish -p sdk

      - name: Publish wallet-cli
        run: |
          sleep 30
          cargo publish -p wallet-cli