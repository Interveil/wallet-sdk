[package]
name = "wallet-cli"
version = "0.1.0"
edition = "2024"
description = "CLI tool for multichain wallet SDK"
license = "BSD-3-Clause"
repository = "https://github.com/Interveil/wallet-sdk"
keywords = ["wallet", "cli", "cryptocurrency"]
categories = ["command-line-interface"]

[[bin]]
name = "wallet"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
sdk = { path = "../sdk" }
anyhow = "1"
dialoguer = "0.11"
hex = "0.4"
bs58 = "0.5"
bech32 = "0.11"
rand = "0.8"
