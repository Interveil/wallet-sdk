[package]
name = "veil-wallet-sdk"
version.workspace = true
edition.workspace = true
description = "Multichain wallet SDK with ETH, SOL, and PVX support"
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["wallet", "multichain", "ethereum", "solana", "privacy"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
bip39 = { version = "2.2", features = ["rand"] }
veil-eth = { path = "../veil-eth", version = "0.1.0" }
veil-sol = { path = "../veil-sol", version = "0.1.0" }
veil-pvx = { path = "../veil-pvx", version = "0.1.0" }
veil-storage = { path = "../veil-storage", version = "0.1.0" }
interveil-sdk = { git = "https://github.com/Interveil/veil-sdk" }
thiserror = "2"
zeroize = { version = "1", features = ["zeroize_derive", "std"] }
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
bech32 = "0.11"
ed25519-dalek = "2.2"

[dev-dependencies]
blake3 = "1"
k256 = "0.13"
serde_json = "1"
