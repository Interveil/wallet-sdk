[package]
name = "veil-cli"
version.workspace = true
edition.workspace = true
description = "CLI tool for multichain wallet SDK"
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["wallet", "cli", "cryptocurrency"]
categories = ["command-line-interface"]

[[bin]]
name = "veil"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
veil-wallet-sdk = { path = "../veil-wallet-sdk", version = "0.1.0" }
anyhow = "1"
dialoguer = "0.11"
hex = "0.4"
bs58 = "0.5"
bech32 = "0.11"
rand = "0.8"
