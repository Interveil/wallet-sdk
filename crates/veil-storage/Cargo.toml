[package]
name = "veil-storage"
version.workspace = true
edition.workspace = true
description = "Encrypted wallet storage (AES-256-GCM + Argon2)"
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["wallet", "encryption", "aes-gcm", "argon2", "cryptocurrency"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
thiserror = "2"

[dev-dependencies]
bip39 = "2.2"
