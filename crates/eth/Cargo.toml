[package]
name = "eth"
version = "0.1.0"
edition = "2024"
description = "Ethereum address derivation module"
license = "BSD-3-Clause"
repository = "https://github.com/Interveil/wallet-sdk"
keywords = ["ethereum", "address", "bip44", "cryptocurrency"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "std"] }
k256 = "0.13"
tiny-keccak = { version = "2", features = ["keccak"] }
hex = "0.4"
thiserror = "2"

[dev-dependencies]
wallet-core = "0.1.0"
