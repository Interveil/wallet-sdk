[package]
name = "eth"
version = "0.1.0"
edition = "2024"

[dependencies]
wallet-core = { path = "../wallet-core" }
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "std"] }
k256 = "0.13"
tiny-keccak = { version = "2", features = ["keccak"] }
hex = "0.4"
thiserror = "2"
