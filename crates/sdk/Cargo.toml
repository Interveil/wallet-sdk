[package]
name = "sdk"
version = "0.1.0"
edition = "2024"
description = "Multichain wallet SDK with ETH, SOL, and PVX support"
license = "BSD-3-Clause"
repository = "https://github.com/Interveil/wallet-sdk"
keywords = ["wallet", "multichain", "ethereum", "solana", "privacy"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
wallet-core = "0.1.0"
eth = "0.1.0"
sol = "0.1.0"
veil = "0.1.0"
storage = "0.1.0"
thiserror = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
