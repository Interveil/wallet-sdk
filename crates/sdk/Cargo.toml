[package]
name = "sdk"
version.workspace = true
edition.workspace = true
description = "Multichain wallet SDK with ETH, SOL, and PVX support"
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["wallet", "multichain", "ethereum", "solana", "privacy"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
bip39 = { version = "2.2", features = ["rand"] }
eth = "0.1.0"
sol = "0.1.0"
veil = "0.1.0"
storage = "0.1.0"
thiserror = "2"
zeroize = { version = "1", features = ["zeroize_derive", "std"] }
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
bech32 = "0.11"

[dev-dependencies]
ed25519-dalek = "2.2"
k256 = "0.13"
